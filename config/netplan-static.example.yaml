# Example netplan snippet for QF9700 (static). Real file is generated per-interface as
# /etc/netplan/99-qf9700-<iface>.yaml by configure.sh. Do NOT copy blindly.
# Generated by qf9700-offline-installer. Safe to delete with uninstall.sh.
network:
  version: 2
  ethernets:
    enx000000000000:  # replace with your interface (see ./detect.sh)
      dhcp4: no
      dhcp6: no
      optional: true
      addresses: [192.168.1.50/24]
      routes:
        - to: default
          via: 192.168.1.1
          metric: 200
      nameservers:
        addresses: [1.1.1.1, 8.8.8.8]
