# Example netplan snippet for QF9700 (DHCP). Real file is generated per-interface as
# /etc/netplan/99-qf9700-<iface>.yaml by configure.sh. Do NOT copy blindly.
# Generated by qf9700-offline-installer. Safe to delete with uninstall.sh.
network:
  version: 2
  ethernets:
    enx000000000000:  # replace with your interface (see ./detect.sh)
      dhcp4: true
      dhcp6: true
      optional: true
